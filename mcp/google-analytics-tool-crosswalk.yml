coverage:
  mcp_tools: 9
  bound_to_rest: 6
  mcp_only: 3
  rest_operations_in_repo: 127
  rest_operations_with_a_tool: 6
  note: >-
    Six of nine tools bind to a REST operation; the other three sit on v1alpha
    surfaces with no captured contract. In the other direction the gap is the story:
    the repo holds 127 REST operations across the GA4 Data, Admin, Management v3,
    Reporting v4, Measurement Protocol and User Deletion APIs, and Google's MCP
    server reaches six of them. Every write operation, all of Universal Analytics'
    Management v3 surface, the Measurement Protocol and User Deletion are absent from
    the agent surface entirely.
