versioning:
  scheme: >-
    Path-prefixed channel versions per service — /v1beta (stable), /v1alpha
    (preview). Universal Analytics-era services used /v3 and /v4 in the path or in
    the host servicePath.
  current:
    - api: Google Analytics Data API
      version: v1beta
      channel: stable
      base: https://analyticsdata.googleapis.com
    - api: Google Analytics Data API
      version: v1alpha
      channel: preview
      base: https://analyticsdata.googleapis.com
      note: >-
        Carries report tasks, funnel reports and conversion reporting. Google's own
        MCP server calls v1alpha for three of its nine tools.
    - api: Google Analytics Admin API
      version: v1beta
      channel: stable
      base: https://analyticsadmin.googleapis.com
    - api: Google Analytics Admin API
      version: v1alpha
      channel: preview
      base: https://analyticsadmin.googleapis.com
    - api: Measurement Protocol (GA4)
      version: unversioned
      channel: stable
      base: https://www.google-analytics.com/mp
      note: >-
        No version token in the path. Regional endpoint
        https://region1.google-analytics.com/mp is also published.
  policy_note: >-
    Google publishes no numbered deprecation window for the Analytics APIs. Changes
    are announced in the per-API changelogs and the google-analytics-api-notify
    Google Group. The v1alpha channel is explicitly unstable — the Admin API
    changelog records a straight rename (createSubproperty -> provisionSubproperty,
    2024-08-01) labelled "Breaking change", with no alias period.
