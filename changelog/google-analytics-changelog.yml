provider: Google Analytics
providerId: google-analytics
scheme: >-
  Dated prose changelogs, one per API, published on the developer site. Entries are
  headed by an ISO date and a change title. There is no version number attached to an
  entry — the version is the API channel (v1beta / v1alpha) named inside it.
