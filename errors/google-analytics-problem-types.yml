method: searched
source: >-
  https://developers.google.com/analytics/devguides/reporting/data/v1/errors (fetched
  2026-08-13, HTTP 200) enriched with the 4xx/5xx responses declared in
  openapi/*.yml and openapi/_original/*.yaml
provider: Google Analytics
providerId: google-analytics
format: google-canonical
rfc9457: false
description: >-
  Google Analytics APIs do not use RFC 9457 problem+json. They return the Google API
  canonical error envelope — a JSON object with a single `error` member carrying
  `code` (HTTP status), `message` (human string) and `status` (the canonical Google
  API error enum). The `status` string, not the HTTP code, is the field a client
  should branch on: several distinct conditions share HTTP 400.
envelope:
  content_type: application/json
  shape: |
    {
      "error": {
        "code": 403,
        "message": "User does not have sufficient permissions for this property.",
        "status": "PERMISSION_DENIED"
      }
    }
  fields:
    - name: error.code
      type: integer
      description: The HTTP status code, such as 400, 401, 403, 429, or 500.
    - name: error.message
      type: string
      description: A short human-readable description of the error.
    - name: error.status
      type: string
      description: >-
        The canonical Google API error code, such as INVALID_ARGUMENT,
        UNAUTHENTICATED, PERMISSION_DENIED, RESOURCE_EXHAUSTED or INTERNAL.
problem_types:
  - status: 400
    canonical: INVALID_ARGUMENT
    title: Bad Request
    description: >-
      The request is malformed. Commonly a missing or invalid parameter — an
      incorrect date range, a malformed filter expression, or an incompatible
      dimension/metric combination.
    remediation: >-
      Validate the request against the OpenAPI schema. For dimension/metric pairings,
      call properties.checkCompatibility before running the report rather than
      retrying.
    retryable: false
  - status: 401
    canonical: UNAUTHENTICATED
    title: Invalid Credentials
    description: >-
      The request has no valid authentication credentials for the target resource.
      Typically a missing, invalid or expired OAuth 2.0 access token.
    remediation: >-
      Refresh the OAuth 2.0 access token against
      https://oauth2.googleapis.com/token and retry once. See
      authentication/google-analytics-authentication.yml.
    retryable: false
  - status: 403
    canonical: PERMISSION_DENIED
    title: Insufficient Permissions
    description: >-
      The authenticated user is valid but does not have access to the requested
      Google Analytics property.
    remediation: >-
      Grant the calling identity a role on the property in the Google Analytics
      admin UI, or check that the granted OAuth scope covers the operation
      (analytics.readonly cannot perform Admin API writes).
    retryable: false
  - status: 403
    canonical: RESOURCE_EXHAUSTED
    title: Admin API rate limit exceeded
    description: >-
      The Admin API returns 403 (not 429) when the per-minute request or write quota
      is exhausted. Quotas refill every 60 seconds.
    remediation: Wait for the next 60-second window and retry.
    retryable: true
    scope: Google Analytics Admin API
  - status: 429
    canonical: RESOURCE_EXHAUSTED
    title: Quota Exceeded
    description: >-
      The request was denied because a Data API quota limit was reached — a
      per-project or per-property token, concurrency or server-error quota.
    remediation: >-
      Back off exponentially. Send "returnPropertyQuota": true to read the remaining
      token balance in the response, and see
      rate-limits/google-analytics-rate-limits.yml for the quota table.
    retryable: true
  - status: 500
    canonical: INTERNAL
    title: Internal Server Error
    description: An unexpected server error occurred. Usually transient.
    remediation: >-
      Retry with exponential backoff AND a retry limit. Server errors themselves
      consume a quota (10 per project per property per hour on Standard, 50 on 360),
      so unbounded retry will get the property blocked.
    retryable: true
  - status: 503
    canonical: UNAVAILABLE
    title: Service Unavailable
    description: The service is temporarily unavailable. Usually transient.
    remediation: Retry with exponential backoff and a retry limit, as with 500.
    retryable: true
quota_interaction:
  - name: Server Errors quota
    description: >-
      500 and 503 responses charge the Server Errors quota. When it is exhausted for
      a project/property pair, ALL requests from that project to that property are
      blocked.
    source: https://developers.google.com/analytics/devguides/reporting/data/v1/quotas
  - name: Client errors per project per property
    description: >-
      Added 2024-06-28. 10,000 responses with any code other than 200 or 500 are
      allowed per project, per property, in a rolling 15-minute window. Exceeding it
      temporarily blocks further calls to that property. Authentication errors and
      incompatible dimension/metric requests both count against it.
    source: https://developers.google.com/analytics/devguides/reporting/data/v1/changelog
spec_coverage:
  declared_in_openapi:
    '400': 4
    '401': 2
    '403': 4
  note: >-
    The captured OpenAPI files declare error responses on only a handful of
    operations and never declare 429, 500 or 503. The catalog above is authoritative
    over the specs and comes from Google's own Error Responses reference.
