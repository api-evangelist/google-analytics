findings:
- No Google Analytics API host publishes /.well-known/ anything. Discovery on these hosts happens through
  the Google API Discovery Service instead (https://analyticsdata.googleapis.com/$discovery/rest?version=v1beta,
  https://analyticsadmin.googleapis.com/$discovery/rest?version=v1beta — both 200, captured under discovery/).
- No agent card is served on any host, at either the canonical /.well-known/agent-card.json path or the
  legacy /.well-known/agent.json path. No AgentCard artifact was written.
- No ai-plugin.json and no api-catalog anywhere in the estate.
