gaps:
  - >-
    There is no first-party client library for the Measurement Protocol (GA4). It is
    a plain HTTPS POST to https://www.google-analytics.com/mp/collect with an
    api_secret query parameter, and Google ships no SDK for it in any language.
  - >-
    The browser collection surface (gtag.js / Google Tag Manager) is distributed from
    a CDN, not a package registry, and is unpinned — see
    components/google-analytics-components.yml.
