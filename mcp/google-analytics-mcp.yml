  package metadata from https://pypi.org/pypi/analytics-mcp/json
provider: Google Analytics
providerId: google-analytics
name: Google Analytics MCP Server
status: official
description: >-
  Google publishes an official (labelled "Experimental") MCP server for Google
  Analytics. It is a LOCAL stdio server: you install it with pipx/uv and an MCP
  client launches it as a subprocess. There is no hosted endpoint an agent can POST
  to. It wraps the Google Analytics Admin API and Google Analytics Data API (GA4)
  and authenticates with Application Default Credentials, so the human running it
  must already hold Google Analytics access.
deployment:
  mode: local-stdio
  install: pipx run analytics-mcp
  package: https://pypi.org/project/analytics-mcp/
  repository: https://github.com/googleanalytics/google-analytics-mcp
  auth: oauth
  verified: searched
  note: >-
    No remote/hosted MCP endpoint exists. Every install path in Google's README is a
    local subprocess launch ("command": "pipx", "args": ["run", "analytics-mcp"] in
    ~/.gemini/settings.json, or `claude mcp add analytics-mcp -- pipx run
    analytics-mcp`). Credentials come from Google Application Default Credentials
    (gcloud auth application-default login) and must carry the
    https://www.googleapis.com/auth/analytics.readonly scope. Because there is no
    URL, tools/list could not be probed live; the tool inventory below was read from
    the server's own source on main.
