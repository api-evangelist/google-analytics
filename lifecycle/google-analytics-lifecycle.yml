findings:
  - >-
    Seven of the thirteen OpenAPI files in this repo describe Universal Analytics-era
    services that Google sunset on 2024-07-01. They are kept as historical record,
    not as callable contracts. The GA4-era surface is the Data API v1beta, the Admin
    API v1beta/v1alpha and the GA4 Measurement Protocol.
  - >-
    All four sunset doc URLs return HTTP 200 with a "page isn't available" body —
    a soft-404. Anything that treats 200 as evidence of a live surface will
    mis-credit these.
