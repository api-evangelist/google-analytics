coverage:
  tool_count: 9
  write_tools: 0
  note: >-
    The server is read-only. Nothing in it creates, patches, archives or deletes a
    Google Analytics resource, even though the Admin API exposes 80+ write
    operations. The Measurement Protocol (event ingestion) is not exposed either.
