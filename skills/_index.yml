cross_cutting_rules:
  - No Google Analytics API supports idempotency keys. Never build a blind retry around a write.
  - >-
    No rate-limit response headers exist. The Data API exposes quota in-band only when a
    request sets returnPropertyQuota=true.
  - >-
    The Admin API returns HTTP 403 on quota exhaustion, the Data API returns 429. Reading
    403 as a permissions failure is the most common misdiagnosis on this platform.
  - >-
    Retries are self-limiting: 5xx charge a server-error quota and every other non-200
    charges a client-error quota. Exhausting either blocks the project from the property.
  - Branch on error.status (the Google canonical code), not on the HTTP status.
