summary: 'None of the Google Analytics API hosts serve any /.well-known/ document — every path returns
  404 on analyticsdata.googleapis.com, analyticsadmin.googleapis.com, analyticsreporting.googleapis.com,
  www.google-analytics.com, www.googleapis.com and developers.google.com. The real, served documents live
  on Google''s shared identity and corporate hosts: accounts.google.com publishes the OpenID Provider
  and OAuth 2.0 Authorization Server metadata that every Google Analytics API client authenticates against,
  and www.google.com publishes Google''s security.txt (the vulnerability disclosure surface that covers
  Google Analytics).'
